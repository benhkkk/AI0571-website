# ============================================================
# AI0571 资讯自动更新
# ------------------------------------------------------------
# 触发方式：
#   1) 定时触发：每 10 分钟一次（GitHub Actions 使用 UTC，
#      */10 分钟间隔无需换算时区）
#   2) 手动触发：仓库 Actions 页面 → 本工作流 → Run workflow
#
# 执行流程：
#   checkout → 安装依赖 → 运行 fetch_news.py（抓取 RSS 并改写
#   index.html + data.json）→ 有变更则 git commit + push →
#   Cloudflare Pages 检测到 push 后自动重新部署 →
#   前端每 5 分钟轮询 data.json 自动更新页面
#
# 注意：GitHub Actions 的 schedule 触发可能延迟/跳过（官方
# 说明），此处为兜底频率；如对实时性要求更高可迁移到
# Cloudflare Workers Cron + KV。
# ============================================================
name: daily-update

on:
  schedule:
    # 每 10 分钟触发一次（UTC 与北京时间分钟间隔一致）
    - cron: '*/10 * * * *'
  workflow_dispatch:        # 手动触发按钮，方便测试

# 赋予工作流对仓库的写入权限（用于 push 更新后的 index.html / data.json）
permissions:
  contents: write

# 防止并发冲突：cron 每 5 分钟触发一次、单次运行约 2 分钟，两个运行会重叠，
# 同时改 data.json 必然产生 git rebase 冲突导致推送失败。
# cancel-in-progress: true —— 新运行自动取消旧运行（旧运行的抓取结果会被新运行
# 重新抓取覆盖，不会丢失数据），从根上消除并发 push。
concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1) 拉取仓库代码（含 index.html、fetch_news.py）
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 安装 Python 3.12（脚本仅用标准库 + requests/feedparser）
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3) 安装依赖
      - name: 安装依赖
        run: pip install -r requirements.txt

      # 4) 抓取 RSS 并改写 index.html + data.json
      #    脚本容错：单源失败自动跳过；全部失败则保留旧数据（退出码 1）
      - name: 抓取并更新资讯
        run: python fetch_news.py

      # 4b) 抓取 GitHub 每周热 Skill 榜单（使用内置 GITHUB_TOKEN 认证，避开匿名限额）
      #     搜索失败时脚本保留旧数据并正常退出，不影响本步骤
      - name: 抓取技能包榜单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_skills.py

      # 4c) 工作日早晨（北京 08:00，即 UTC 00:00~00:09）触发日报群发
      #     调用 Pages Function /api/send-digest?broadcast=1&token=xxx；
      #     端点内置「当天只发一次」的 KV 幂等标记，Actions 多次命中窗口也不会重复发送。
      #     需要把 ADMIN_TOKEN 加到仓库 Secrets（值 = Pages 项目里配置的 ADMIN_TOKEN）。
      - name: 工作日早晨发送 AI 日报
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          D=$(date -u +%u)      # 1=周一 ... 7=周日
          H=$(date -u +%H)
          M=$(date -u +%M)
          if [ "$D" -le 5 ] && [ "$H" = "00" ] && [ "$M" -lt 10 ]; then
            echo "工作日早晨发送窗口（UTC $H:$M），触发日报群发..."
            curl -s --max-time 120 "https://www.AI0571.com/api/send-digest?broadcast=1&token=${ADMIN_TOKEN}"
            echo ""
          else
            echo "非发送窗口（星期${D} UTC $H:$M），跳过日报群发。"
          fi

      # 5) 若 index.html / data.json 有变更，则提交并推送
      #    使用默认 GITHUB_TOKEN（权限已在 permissions 中声明）
      #    推送后 Cloudflare Pages 会自动触发重新部署
      #    推送冲突（远程有并发提交）时自动 pull --rebase 重试，最多 3 次
      - name: 提交并推送更新
        run: |
          if git diff --quiet; then
            echo "数据无变化，无需提交。"
            exit 0
          fi
          git config user.name  "ai0571-bot"
          git config user.email "ai0571-bot@users.noreply.github.com"
          git add index.html data.json fetch_skills.py
          git commit -m "chore: 资讯自动更新 $(date -u +'%Y-%m-%dT%H:%M'Z)"
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "已推送更新，等待 Cloudflare Pages 重新部署。"
              exit 0
            fi
            echo "推送冲突（第 $i 次），先同步远程再重试..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "rebase 失败，放弃本次提交。"; exit 1; }
            sleep 8   # 留出时间窗口，避免与对侧 push 反复撞车
          done
          echo "重试后推送失败。"
          exit 1
