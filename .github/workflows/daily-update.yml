# ============================================================
# AI0571 资讯自动更新 + 工作日日报群发
# ------------------------------------------------------------
# 触发方式：
#   1) 定时触发：每 20 分钟一次（GitHub Actions 使用 UTC）
#   2) 手动触发：仓库 Actions 页面 → 本工作流 → Run workflow
#
# 执行流程：
#   checkout → 安装依赖 → fetch_news.py（抓取 RSS 并改写 index.html + data.json）
#   → 命中早安窗口则调用 Pages Function 群发日报（端点自带当天幂等）
#   → 有变更则 git commit + push → Cloudflare Pages 自动重新部署
#
# v3 修复（针对 2026-09 日报静默故障）：
#   1) 发送窗口从「UTC 00:00~00:09 的 10 分钟」放宽到
#      「北京时间 07:00~09:59 的 3 小时」。GitHub 官方明确说明
#      scheduled workflow 会延迟甚至被跳过，窄窗口一旦错过当天就永久
#      不发、且没有任何告警。放宽后每 20 分钟一次 × 3 小时 ≈ 9 次机会，
#      重复请求由 send-digest 端点的 KV 幂等键 digest-sent:YYYY-MM-DD
#      拦住，不会重复发给用户。
#   2) 群发调用结果不再「发完就 echo 空行」。现在会检查 HTTP 状态码与
#      返回体里的 ok 字段，失败即以 ::error:: 让本步骤红叉 → GitHub 会
#      给仓库 owner 发失败邮件，不会再静默。
#   3) 频率从 */10（每天 144 次）降到 */20（每天 72 次）：降低 GitHub
#      侧风控/排队风险，也够用。
# ============================================================
name: daily-update

on:
  schedule:
    # 每 20 分钟触发一次
    - cron: '*/20 * * * *'
  workflow_dispatch:        # 手动触发按钮，方便测试

# 赋予工作流对仓库的写入权限（用于 push 更新后的 index.html / data.json）
permissions:
  contents: write

# 防止并发冲突：两个运行同时改 data.json 必然 push 冲突，
# cancel-in-progress: true —— 新运行取消旧运行（抓取结果会被重新抓取覆盖）。
concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1) 拉取仓库代码（含 index.html、fetch_news.py）
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 安装 Python 3.12（脚本仅用标准库 + requests/feedparser）
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3) 安装依赖
      - name: 安装依赖
        run: pip install -r requirements.txt

      # 4) 抓取 RSS 并改写 index.html + data.json
      #    脚本容错：单源失败自动跳过；全部失败则保留旧数据（退出码 1）
      - name: 抓取并更新资讯
        run: python fetch_news.py

      # 4b) 抓取 GitHub 每周热 Skill 榜单（使用内置 GITHUB_TOKEN 认证，避开匿名限额）
      - name: 抓取技能包榜单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_skills.py

      # 4c) 工作日早晨触发日报群发
      #     直接以北京时间判断，避免 UTC 换算出错。
      #     端点自带「当天只发一次」幂等，所以这里放宽到 3 小时宽窗口也不怕重复发。
      - name: 工作日早晨发送 AI 日报
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          # 用「UTC + 8 小时」显式换算北京时间，不依赖 runner 上的 tzdata
          DOW=$(date -u -d '+8 hours' +%u)      # 1=周一 ... 7=周日
          BH=$(date -u -d '+8 hours' +%H)
          BM=$(date -u -d '+8 hours' +%M)
          echo "当前北京时间 $(date -u -d '+8 hours' '+%F %T')，周${DOW}"

          # 宽窗口：北京时间 07:00~09:59 的工作日，每次运行都会尝试
          if [ "${DOW}" -le 5 ] && [ "${BH}" -ge 7 ] && [ "${BH}" -le 9 ]; then
            if [ -z "${ADMIN_TOKEN:-}" ]; then
              echo "::error::仓库 Secret ADMIN_TOKEN 为空 —— 无法调用群发端点。请到 Settings → Secrets and variables → Actions 补上。"
              exit 1
            fi
            echo "命中发送窗口（北京 ${BH}:${BM}），调用 /api/send-digest ..."
            OUT="$(mktemp)"
            HTTP=$(curl -s -S -o "$OUT" -w '%{http_code}' --max-time 180 \
              "https://www.AI0571.com/api/send-digest?broadcast=1&via=actions&token=${ADMIN_TOKEN}")
            CODE=$?
            BODY="$(cat "$OUT")"
            echo "curl 退出码=${CODE}  HTTP=${HTTP}"
            echo "$BODY"

            if [ "$CODE" -ne 0 ]; then
              echo "::error::调用 /api/send-digest 失败（curl 退出码 ${CODE}）：站点不可达/超时"
              exit 1
            fi
            if [ "$HTTP" != "200" ]; then
              echo "::error::/api/send-digest 返回 HTTP ${HTTP}：${BODY}"
              exit 1
            fi
            if ! echo "$BODY" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "::error::/api/send-digest 未返回 ok:true：${BODY}"
              exit 1
            fi
            echo "日报步骤完成（返回里出现 skipped:true 表示今天已发过，属正常幂等拦截）。"
          else
            echo "非发送窗口（北京周${DOW} ${BH}:${BM}），跳过群发。"
          fi

      # 5) 若 index.html / data.json 有变更，则提交并推送
      #    推送后 Cloudflare Pages 会自动触发重新部署
      - name: 提交并推送更新
        run: |
          if git diff --quiet; then
            echo "数据无变化，无需提交。"
            exit 0
          fi
          git config user.name  "ai0571-bot"
          git config user.email "ai0571-bot@users.noreply.github.com"
          git add index.html data.json fetch_skills.py
          git commit -m "chore: 资讯自动更新 $(date -u +'%Y-%m-%dT%H:%M'Z)"
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "已推送更新，等待 Cloudflare Pages 重新部署。"
              exit 0
            fi
            echo "推送冲突（第 $i 次），先同步远程再重试..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "rebase 失败，放弃本次提交。"; exit 1; }
            sleep 8   # 留出时间窗口，避免与对侧 push 反复撞车
          done
          echo "重试后推送失败。"
          exit 1

      # 6) 失败提示：把「去哪里看」直接写进日志，避免无人发现
      - name: 失败处置指引
        if: failure()
        run: |
          echo "::warning::本次自动更新/群发失败。"
          echo "1) 先看本工作流哪一步红的；"
          echo "2) 打开 https://github.com/${{ github.repository }}/actions 看运行历史，"
          echo "   若全部运行都是 startup_failure，说明 GitHub Actions 侧已被停用/受限；"
          echo "3) 浏览器打开 https://www.AI0571.com/api/health?ui=1&token=你的ADMIN_TOKEN 看链路红绿灯。"
